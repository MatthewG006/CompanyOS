name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: companyos
          POSTGRES_PASSWORD: companyos_ci_password
          POSTGRES_DB: companyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U companyos -d companyos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://companyos:companyos_ci_password@localhost:5432/companyos
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate the test database
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Route tests
        run: npm run test:routes
